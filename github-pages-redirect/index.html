<!doctype html>
<!--
  The app moved from https://valevoor.github.io/nmms-prep/ to https://mystudyprep.in/.
  GitHub Pages can't send a server redirect, so this page is published at every old address
  (and as 404.html for the rest) and sends the visitor to the same page on the new site.
  /nmms-prep/welcome/ -> /welcome/, /nmms-prep/#/t/number-series -> /#/t/number-series.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NMMS Prep has moved</title>
    <link rel="canonical" href="https://mystudyprep.in/" />
    <meta name="robots" content="noindex" />
    <script>
      ;(function () {
        var path = location.pathname.replace(/^\/nmms-prep(\/|$)/, '/').replace(/(^|\/)(index|404)\.html$/, '$1')
        location.replace('https://mystudyprep.in' + path + location.search + location.hash)
      })()
    </script>
    <meta http-equiv="refresh" content="0; url=https://mystudyprep.in/" />
    <style>
      body { font: 18px/1.5 system-ui, sans-serif; background: #f6f7fb; color: #1d2433; margin: 0; padding: 48px 16px; text-align: center; }
      a { color: #2f5bea; font-weight: 600; }
    </style>
  </head>
  <body>
    <p>NMMS Prep has moved to <a href="https://mystudyprep.in/">mystudyprep.in</a>.</p>
  </body>
</html>
