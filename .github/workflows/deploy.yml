# Checks the app, then builds it and deploys it to Cloudflare (https://mystudyprep.in) on every push to main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare Workers" rights)
# and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: https://mystudyprep.in/
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check:content
      - run: npm run build
      # The talk deck (slides/, a Marp file) is published at /slides/ next to the app.
      - run: npx --yes @marp-team/marp-cli@4 ../slides/nmms-exam-overview.md --html -o dist/slides/index.html
      - run: cp -r ../slides/assets dist/slides/assets
      # Uploads dist/ as set in app/wrangler.jsonc.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          wranglerVersion: '4'
          command: deploy
