<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free NMMS exam practice with 41 MAT chapters, 59 SAT topics, past exam questions and worked solutions. No sign-up, and it works offline." />
    <link rel="canonical" href="https://valevoor.github.io/nmms-prep/welcome/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NMMS Prep" />
    <meta property="og:title" content="NMMS Prep: Free MAT and SAT Practice App for Class 8" />
    <meta property="og:description" content="Free NMMS exam practice with 41 MAT chapters, 59 SAT topics, past exam questions and worked solutions. No sign-up, and it works offline." />
    <meta property="og:url" content="https://valevoor.github.io/nmms-prep/welcome/" />
    <meta property="og:image" content="https://valevoor.github.io/nmms-prep/icon-512.png" />
    <meta name="theme-color" content="#2f5bea" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>NMMS Prep: Free MAT and SAT Practice App for Class 8</title>
    <script>
      // A new visitor to the bare URL gets the landing page (public/welcome/index.html). A link into the app
      // (any #/ route), a returning student (anything saved by the app) and the installed app go straight in.
      try {
        var returning = Object.keys(localStorage).some(function (k) {
          return k.indexOf('nmms-') === 0
        })
        var installed = navigator.standalone || matchMedia('(display-mode: standalone)').matches
        if (!location.hash && !returning && !installed && !/\/(welcome|about)\/?$/.test(location.pathname)) location.replace('./welcome/')
      } catch (e) {
        // Storage blocked: open the app.
      }
    </script>
    <script>
      // Apply the saved theme before first paint (default Light). Kept in sync with src/lib/theme.ts.
      try {
        var t = localStorage.getItem('nmms-theme')
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="92542264-dc03-424f-9a0b-e3d5eadaa626"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
