<!doctype html>
<!-- The app. worker.ts (live) and the service worker (offline) answer every app path (/mat, /sat/…) with this page;
     the landing page at / is public/index.html. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The app answers nested paths (/mat/number-series/learn), so relative URLs (figures/…) start from the root. -->
    <base href="/" />
    <meta name="description" content="Free NMMS exam practice with 41 MAT chapters, 80 SAT topics, past exam questions and worked solutions. No sign-up, and it works offline." />
    <link rel="canonical" href="https://mystudyprep.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NMMS Prep" />
    <meta property="og:title" content="NMMS Prep: Free MAT and SAT Practice App for Class 8" />
    <meta property="og:description" content="Free NMMS exam practice with 41 MAT chapters, 80 SAT topics, past exam questions and worked solutions. No sign-up, and it works offline." />
    <meta property="og:url" content="https://mystudyprep.in/" />
    <!-- 1200×630, made from tools/og-image.html -->
    <meta property="og:image" content="https://mystudyprep.in/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NMMS Prep: free MAT and SAT practice for Class 8, with 41 MAT chapters, 80 SAT topics and past exam questions. Works offline, in English and Kannada." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2f5bea" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>NMMS Prep: Free MAT and SAT Practice App for Class 8</title>
    <script>
      // Apply the saved theme before first paint (default Light). Kept in sync with src/lib/theme.ts.
      try {
        var t = localStorage.getItem('nmms-theme')
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
